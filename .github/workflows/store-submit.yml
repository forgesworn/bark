name: Store submit

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published release tag to submit (e.g. v1.3.14)"
        required: true
      chrome:
        description: "Submit to Chrome Web Store"
        type: boolean
        default: false
      firefox:
        description: "Submit to AMO (Firefox)"
        type: boolean
        default: true
      chrome_auth_only:
        description: "Check Chrome token generation only; do not upload or submit"
        type: boolean
        default: false

permissions:
  contents: read

# Serialise all store writes, including retries and different release tags.
concurrency:
  group: store-submit
  cancel-in-progress: false

jobs:
  chrome:
    if: >-
      github.repository == 'forgesworn/bark' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.chrome) ||
       (github.event_name == 'release' && !github.event.release.prerelease && vars.CWS_AUTO_SUBMIT == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted automation lives on main; package bytes always come from the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check Chrome configuration
        env:
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          for name in CWS_SERVICE_ACCOUNT CWS_WORKLOAD_IDENTITY_PROVIDER; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: $name. See docs/store-submit.md."
              exit 1
            fi
          done
      - name: Obtain short-lived Chrome token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit exact Chrome release
        if: inputs.chrome_auth_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          CWS_EXTENSION_ID: gdpcaoemjjglcebpjjljmhndbpeckpln
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node scripts/store-submit.mjs "$RELEASE_VERSION" --no-firefox
      - name: Report authentication check
        if: inputs.chrome_auth_only == true
        run: echo 'Google accepted the GitHub identity and minted a token. Store access, upload and submission were not tested.'

  firefox:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.firefox && !inputs.chrome_auth_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Submit exact Firefox release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/store-submit.mjs "$RELEASE_VERSION" --no-chrome
