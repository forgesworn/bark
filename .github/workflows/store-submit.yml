# Submit a released version to the extension stores. Manually triggered on
# purpose: a store submission is a deliberate act, like a deploy. The release
# workflow (tag push) builds and attaches the zips this job submits.
#
# One code path with the local route: this just runs scripts/store-submit.mjs,
# which downloads the release assets and cuts the AMO source zip and the
# release-notes changelog from the tag itself - so the scripts run from main
# while the submitted content is exactly the tagged release's. (Checking out
# the tag here instead was the first version's bug: the submit scripts do not
# exist in older tags' trees.)
#
# Needs repo secrets (docs/store-submit.md explains minting each):
#   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   AMO_JWT_ISSUER, AMO_JWT_SECRET
name: Store submit

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to submit (e.g. v1.3.7)"
        required: true
      chrome:
        description: "Submit to the Chrome Web Store (needs the CWS OAuth secrets; Chrome is a manual dashboard job by choice)"
        type: boolean
        default: false
      firefox:
        description: "Submit to AMO (Firefox)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The orchestrator reads CHANGELOG.md and the source tree out of the
          # tag with `git show`/`git archive`, so tags must be fetched.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit
        env:
          GH_TOKEN: ${{ github.token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          node scripts/store-submit.mjs "${{ inputs.version }}" \
            ${{ inputs.chrome != true && '--no-chrome' || '' }} \
            ${{ inputs.firefox != true && '--no-firefox' || '' }}
