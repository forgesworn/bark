# Submit a released version to the extension stores. Manually triggered on
# purpose: a store submission is a deliberate act, like a deploy. The release
# workflow (tag push) builds and attaches the zips this job submits.
#
# Needs repo secrets (docs/store-submit.md explains minting each):
#   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   AMO_JWT_ISSUER, AMO_JWT_SECRET
name: Store submit

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to submit (e.g. v1.3.7)"
        required: true
      chrome:
        description: "Submit to the Chrome Web Store"
        type: boolean
        default: true
      firefox:
        description: "Submit to AMO (Firefox)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag's own tree: its CHANGELOG section becomes the AMO release
          # notes, and the source zip must match the submitted build.
          ref: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "bark-${{ inputs.version }}.zip" \
            --pattern "bark-firefox-${{ inputs.version }}.zip"

      - name: Build the AMO source zip from the tag
        run: git archive --format=zip -o "bark-${{ inputs.version }}-source.zip" "${{ inputs.version }}"

      - name: Submit to the Chrome Web Store
        if: ${{ inputs.chrome }}
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/cws-submit.mjs --zip "bark-${{ inputs.version }}.zip"

      - name: Submit to AMO
        if: ${{ inputs.firefox }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          node scripts/amo-submit.mjs \
            --zip "bark-firefox-${{ inputs.version }}.zip" \
            --source "bark-${{ inputs.version }}-source.zip" \
            --version "${{ inputs.version }}"
