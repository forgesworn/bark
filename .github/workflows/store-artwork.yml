name: Update Firefox listing artwork
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable release tag containing the artwork
        required: true
      resume_previews:
        description: Five accepted preview IDs in screenshot order, comma-separated; use 0 for missing (also skips reuploading the accepted icon)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: store-submit
  cancel-in-progress: false
jobs:
  artwork:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Update artwork from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          RESUME_PREVIEWS: ${{ inputs.resume_previews }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-artwork.mjs "$RELEASE_TAG" --resume-previews "$RESUME_PREVIEWS" --apply
